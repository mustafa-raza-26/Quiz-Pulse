<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pulse - Sign Up</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Accents -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <!-- Signup Container -->
    <div class="quiz-card">
        
        <!-- Brand Header -->
        <div class="quiz-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-brain"></i>
            </div>
            <h4 class="fw-bold mt-3 mb-1" style="letter-spacing: -0.5px;">Create Account</h4>
            <p class="text-muted small">Join QuizPulse and start testing your skills</p>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="event.preventDefault();">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group-custom">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" class="form-control form-control-custom" id="userName" placeholder="John Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group-custom">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" class="form-control form-control-custom" id="userEmail" placeholder="name@domain.com" required>
                </div>
            </div>


            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" class="form-control form-control-custom" id="userPassword" placeholder="Create password" required>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label small text-muted fw-medium" for="terms">
                    I agree to the <a href="#" class="custom-link">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100" id="signupBtn">
                Create Account <i class="fa-solid fa-user-plus ms-2"></i>
            </button>
        </form>

        <div class="divider">OR SIGN UP WITH</div>

        <button class="btn btn-social w-100 mb-4">
            <i class="fa-brands fa-google fs-5"></i>
            <span >Google</span>
        </button>

        <div class="text-center">
            <span class="small text-muted">Already have an account? </span>
            <a href="index.html" class="custom-link small ms-1">Log In</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="signup.js"></script>
</body>
</html>
