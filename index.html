<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pulse - Log In</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Accents -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <!-- Login Container -->
    <div class="quiz-card">
        
        <!-- Brand Header -->
        <div class="quiz-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-brain"></i>
            </div>
            <h4 class="fw-bold mt-3 mb-1" style="letter-spacing: -0.5px;">Welcome Back</h4>
            <p class="text-muted small">Log in to continue your quiz journey</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="event.preventDefault();">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group-custom">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" class="form-control form-control-custom" id="userEmail" placeholder="name@domain.com" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label">Password</label>
                    <a href="#" class="custom-link small mb-1">Forgot?</a>
                </div>
                <div class="input-group-custom">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" class="form-control form-control-custom" id="userPassword" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-muted fw-medium" for="rememberMe">
                    Remember me on this device
                </label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100" id="loginBtn">
                Login Now <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="divider">OR CONTINUE WITH</div>

        <button class="btn btn-social w-100 mb-4">
            <i class="fa-brands fa-google text-danger fs-5"></i>
            <span>Google</span>
        </button>

        <div class="text-center">
            <span class="small text-muted">Don't have an account? </span>
            <a href="signup.html" class="custom-link small ms-1">Sign Up</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="login.js"></script>
</body>
</html>
